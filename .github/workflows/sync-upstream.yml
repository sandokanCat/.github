name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream safely
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream and merge safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/exampleUser/exampleRepo.git

          git fetch origin main
          git fetch upstream main

          git checkout -B main refs/remotes/origin/main

          if git merge-base --is-ancestor refs/remotes/upstream/main HEAD; then
            echo "Fork already contains the latest upstream commit."
            exit 0
          fi

          git merge --no-edit refs/remotes/upstream/main

          git push origin HEAD:refs/heads/main
